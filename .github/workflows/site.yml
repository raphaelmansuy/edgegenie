name: site

# The page is an output of this repository, so it is built and checked like one: build, verify every
# link and every claim, then deploy. The check runs BEFORE the artifact is uploaded, so a broken page
# cannot replace a working one (spec 008 [PF-7]).

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "specs/**"
      - "exams/results/**"
      - "README.md"
      - "tests/sites/**"
      - "apps/coding-agent/seed/llm_models.yaml"
      - "apps/coding-agent/tools/**"
      - "requirements-site.txt"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the footer prints the commit the page was built from

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install
        run: python -m pip install --upgrade pip && pip install -r requirements-site.txt

      - name: claims must agree with the docs
        run: python site/tests/test_claims.py

      - name: build
        run: python site/build.py

      - name: check every link, claim, image and heading
        run: python site/check.py

      - name: the build must not need an optional dependency
        # The site promises to build with `python3` alone (spec 008 [D3]). Pillow is used only to *draw*
        # the social card and the app icons; committed fallbacks cover a machine without it. This step
        # proves the promise on the runner that actually deploys, instead of trusting a local check.
        run: |
          python - <<'PY'
          import subprocess, sys

          blocker = """
          import sys
          class Block:
              def find_module(self, name, path=None):
                  return self if name == "PIL" or name.startswith("PIL.") else None
              def load_module(self, name):
                  raise ImportError("PIL is blocked for this check")
          sys.meta_path.insert(0, Block())
          """
          for script in ("site/build.py", "site/check.py"):
              r = subprocess.run([sys.executable, "-c",
                                  blocker + f"\nimport runpy; runpy.run_path({script!r}, run_name='__main__')"],
                                 capture_output=True, text=True)
              if r.returncode != 0:
                  print(r.stdout[-2000:]); print(r.stderr[-2000:])
                  sys.exit(f"{script} failed without Pillow")
              print(f"{script}: ok without Pillow")
          PY

      - name: the wireframes are not stale
        # 04-wireframes.md is generated on a character grid. If someone edits a box by hand, this fails
        # rather than shipping a drawing that is one character out (spec 008 [PG-11]).
        run: python specs/008-github-page/tools/draw_wireframes.py --check

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: end-to-end, every page, four widths, both themes
        # Served at /opengenie/ exactly as Pages serves it, so a path that only works at a domain root
        # fails here instead of in production. Playwright lives outside the repository: the site itself
        # still needs nothing but python3.
        run: |
          npm install --no-save --prefix /tmp/pw playwright@1.65.0
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
          PLAYWRIGHT_MODULE=/tmp/pw/node_modules/playwright/index.js node tests/sites/e2e/site.e2e.mjs

      - name: keep the e2e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-e2e-screenshots
          path: |
            tests/sites/e2e/screenshots
            tests/sites/e2e/report.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
