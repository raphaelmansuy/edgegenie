# The catalogue this app ships with, as data.
#
# Every row carries the provenance of its limits (`evidence` + `source`), because a wrong output cap
# makes a model unusable AFTER the user waited, and a guess presented as a measurement is the bug
# this file exists to prevent (spec 005, Axiom A3).
#
#   evidence: measured    a request in this workspace was rejected and the cap was read off the error
#   evidence: documented  a vendor document or a template in this repository
#   evidence: default     nothing is known; the resolver clamps to 64k / 4k and the picker says so
#
# This file is read by `api/adapters/llm/store/seed.py`. It is NOT a permission boundary: grants come
# only from the database, never from here (05 §llm_model_grant).

providers:
  - id: databricks
    display_name: Databricks AI Gateway
    kind: databricks
    wire: serving
    npm: "@ai-sdk/openai-compatible"
    # base_url is deliberately absent: it is derived from DATABRICKS_HOST at runtime, because a host
    # in a data file silently pins a workspace that has moved.
    credential: workspace_token

  - id: openai
    display_name: OpenAI
    kind: openai
    wire: openai
    base_url: https://api.openai.com/v1
    npm: "@ai-sdk/openai-compatible"
    credential: api_key

  - id: anthropic
    display_name: Anthropic
    kind: anthropic
    wire: anthropic
    base_url: https://api.anthropic.com/v1
    npm: "@ai-sdk/anthropic"
    credential: api_key

  - id: google_vertex
    display_name: Google Vertex AI
    kind: google_vertex
    wire: vertex_native
    npm: "@ai-sdk/google-vertex"
    credential: service_account_json
    # The project arrives with the key, so the URL is built per credential rather than stored.
    base_url: ""

models:
  # ---- the five measured in this workspace (docs/genie-code-replacement-spec.md §3.2) ----
  - id: databricks/databricks-llama-4-maverick
    display_name: llama-4-maverick
    endpoint: databricks-llama-4-maverick
    capability: tools
    context: 128000
    output: 8000
    evidence: measured
    source: docs/genie-code-replacement-spec.md §3.2
    # MEASURED, not assumed: POST /serving-endpoints/databricks-llama-4-maverick/invocations with an
    # image_url block returned a description of the pixels ("solid, vibrant coral pink") and billed 161
    # prompt tokens for a 1×1 PNG. The image was consumed, so this model can see. Recorded here because
    # capability must be a declared fact with provenance — the whole point of `sees_images`.
    sees_images: true
    default: true

  - id: databricks/databricks-gpt-oss-120b
    display_name: gpt-oss-120b
    endpoint: databricks-gpt-oss-120b
    capability: tools_and_reasoning
    context: 128000
    output: 24000
    evidence: measured
    source: docs/genie-code-replacement-spec.md §3.2

  - id: databricks/databricks-gpt-oss-20b
    display_name: gpt-oss-20b
    endpoint: databricks-gpt-oss-20b
    capability: tools_and_reasoning
    context: 128000
    output: 24000
    evidence: measured
    source: docs/genie-code-replacement-spec.md §3.2

  - id: databricks/databricks-qwen3-next-80b-a3b-instruct
    display_name: qwen3-next-80b
    endpoint: databricks-qwen3-next-80b-a3b-instruct
    capability: tools
    context: 128000
    output: 10000
    evidence: measured
    source: docs/genie-code-replacement-spec.md §3.2

  - id: databricks/databricks-meta-llama-3-3-70b-instruct
    display_name: meta-llama-3-3-70b
    endpoint: databricks-meta-llama-3-3-70b-instruct
    capability: tools
    context: 128000
    output: 8000
    evidence: measured
    source: docs/genie-code-replacement-spec.md §3.2

  # gated in the workspace until an account admin enables the Unity Gateway beta (FR-20): catalogued
  # so the picker can name the gate instead of hiding the model.
  # MEASURED vision: three random three-digit codes (207, 492, 652) were each read correctly, and a
  # shape/colour question was answered correctly, through the same serving endpoint the agent uses.
  # It is the only model in this workspace that both sees and is served, so it is the one vision support
  # is exercised against. 541 prompt tokens for a 120x77 image — the image is genuinely consumed.
  - id: databricks/databricks-gemma-3-12b
    display_name: gemma-3-12b
    endpoint: databricks-gemma-3-12b
    capability: tools
    context: 131072
    output: 8192
    # `documented`, not `measured`: what was MEASURED is that it sees (three random codes, all read
    # correctly). Its output cap is a datasheet figure — the serving endpoint does not publish one, and
    # claiming a measurement that was never made is the dishonesty `evidence` exists to prevent.
    evidence: documented
    source: https://ai.google.dev/gemma/docs/core/model_card_3 — vision verified 2026-11-09
    sees_images: true

  - id: databricks/databricks-claude-sonnet-4-5
    display_name: claude-sonnet-4-5
    endpoint: databricks-claude-sonnet-4-5
    capability: tools
    context: 200000
    output: 16000
    evidence: documented
    source: https://docs.anthropic.com/en/docs/about-claude/models
    # DOCUMENTED, not measured: Claude Sonnet accepts images per Anthropic's docs, and this endpoint is
    # not deployed in this workspace (ENDPOINT_NOT_FOUND), so the claim could not be verified here. It is
    # marked documented rather than measured for that reason; the flag is a statement about the MODEL.
    sees_images: true
    state: not_enabled

  # ---- Google Vertex / Gemini. 1M context and 30k output are the repository's working template. ----
  - id: google_vertex/google/gemini-3.8-flash
    display_name: gemini-3.8-flash
    endpoint: google/gemini-3.8-flash
    capability: tools_and_reasoning
    context: 1000000
    output: 30000
    evidence: documented
    source: templates/opencode.gemini.json
    wire: vertex_native

  - id: google_vertex/google/gemini-3.8-pro
    display_name: gemini-3.8-pro
    endpoint: google/gemini-3.8-pro
    capability: tools_and_reasoning
    context: 1000000
    output: 30000
    evidence: documented
    source: templates/opencode.gemini.json
    wire: vertex_native

  - id: google_vertex/google/gemini-3.5-flash
    display_name: gemini-3.5-flash
    endpoint: google/gemini-3.5-flash
    capability: tools_and_reasoning
    context: 1000000
    output: 30000
    evidence: documented
    source: templates/opencode.gemini.json
    wire: vertex_native

  # ---- OpenAI. Caps are documented by the vendor; evidence stays `documented`, never `measured` ----
  - id: openai/gpt-4.1
    display_name: gpt-4.1
    endpoint: gpt-4.1
    capability: tools
    context: 128000
    output: 16384
    evidence: documented
    source: https://platform.openai.com/docs/models/gpt-4.1

  - id: openai/gpt-4.1-mini
    display_name: gpt-4.1-mini
    endpoint: gpt-4.1-mini
    capability: tools
    context: 128000
    output: 16384
    evidence: documented
    source: https://platform.openai.com/docs/models/gpt-4.1

  # ---- Anthropic ----
  - id: anthropic/claude-sonnet-4-5
    display_name: claude-sonnet-4-5
    endpoint: claude-sonnet-4-5
    capability: tools
    context: 200000
    output: 16000
    evidence: documented
    source: https://docs.anthropic.com/en/docs/about-claude/models
    # Verified in the repository's working config (docs/genie-code-replacement-spec.md §7.2): with
    # streaming on, tool calls arrive in a shape this agent's mapper does not reassemble.
    tool_streaming: false
