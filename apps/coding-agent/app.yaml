# Databricks App runtime contract (see specs/001 15, RB-02/03/04).
# - command is an array and is NOT run through a shell; only $DATABRICKS_APP_PORT is substituted.
# - the app must bind 0.0.0.0 and exit within 15 s of SIGTERM.
# One process: uvicorn serves the API and the built front end, and spawns `opencode acp` per session.
command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--timeout-graceful-shutdown", "10"]
env:
  - name: APP_AGENT_MODE
    value: stdio
  - name: APP_AGENT_COMMAND
    # The binary is installed at build time by the root package.json (see scripts/prepare-app.sh).
    value: opencode acp
  - name: APP_TOOL_MODE
    value: subprocess
  # Bytes the user attaches (spec 009). It must be a path that survives a restart: the default is the
  # container's temp dir, which is wiped on every redeploy — a chip would come back from the transcript
  # pointing at bytes that no longer exist. `/tmp` is also ephemeral here, so this is a mounted volume
  # path the platform keeps; the store creates the directory if it is absent.
  - name: APP_BLOB_DIR
    value: /tmp/agent-blobs
  - name: APP_REQUIRE_FORWARDED_USER
    value: "true"
  - name: APP_DEFAULT_MODEL
    value: google_vertex/google/gemini-3.8-flash
  - name: APP_MAX_CONCURRENT_AGENTS
    value: "4"
  # External models (spec 005). Off by default; on here because a provider key is attached below.
  # `APP_ENV=production` makes the app refuse a development key-encryption key.
  - name: APP_APP_ENV
    value: production
  - name: APP_LLM_ALLOW_EXTERNAL
    value: "true"
  # Model configuration lives in Lakebase (managed Postgres), reached with the app's own service
  # principal. `APP_LLM_ADMINS` are the people who may change the catalogue for everyone.
  - name: APP_LLM_PG_ENDPOINT
    value: projects/coding-agent-llm/branches/production/endpoints/primary
  # Durable session history shares Lakebase; never falls back to container memory.
  - name: APP_SESSION_USE_LAKEBASE
    value: "true"
  - name: APP_LLM_ADMINS
    value: raphael.mansuy@gmail.com
  # The key-encryption key for stored provider keys. It is an app RESOURCE (a Databricks secret), so a
  # dump of the database is not a dump of the keys.
  - name: APP_LLM_KEK
    valueFrom: llm-kek
  # The Vertex service-account key arrives as an app RESOURCE (a Databricks secret), never as text
  # in this file. The project is named twice because two readers use two prefixes:
  # `LLM_VERTEX_PROJECT` fills a key that omitted project_id (the vault reads it raw);
  # `APP_LLM_VERTEX_PROJECT` is what Settings reads (env prefix APP_) and what the probe URL
  # falls back to. Without the APP_ one, the URL keeps the literal "{project}" and Vertex
  # answers "permission denied on resource project {project}".
  - name: LLM_VERTEX_KEY
    valueFrom: vertex-sa
  - name: LLM_VERTEX_PROJECT
    value: mobioos-506015
  - name: APP_LLM_VERTEX_PROJECT
    value: mobioos-506015
  # Where a Python session exchanges its commands and results with the app: a Unity Catalog volume it
  # must be able to read and write. `scripts/provision-session-volume.sh` creates it and grants that.
  # `auto` tries a session and falls back, in words, to one-shot runs when one cannot start.
  - name: APP_SESSION_VOLUME
    value: /Volumes/workspace/agent_scratch/kernel_sessions
  - name: APP_PYTHON_SESSION
    value: auto
