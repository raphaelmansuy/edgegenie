# Databricks Asset Bundle for the coding-agent app.
bundle:
  name: databricks-coding-agents

resources:
  apps:
    coding-agent:
      name: coding-agent
      description: "Chat with a coding agent (ACP) that works in your workspace"
      source_code_path: ./
      # User authorization (RB-05, D-08): the app acts as the signed-in user, not as a shared SP.
      user_api_scopes:
        - sql
        - files
        - catalog.catalogs:read
        - catalog.schemas:read
        - catalog.tables:read

targets:
  dev:
    default: true
    workspace:
      host: https://YOUR-WORKSPACE.cloud.databricks.com
