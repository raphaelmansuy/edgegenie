[project]
name = "databricks-coding-agents"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "cryptography>=43",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "databricks-sdk>=0.60",
  "pyyaml>=6",
]

[project.urls]
Homepage = "https://raphaelmansuy.github.io/opengenie/"
Documentation = "https://raphaelmansuy.github.io/opengenie/install/"
Repository = "https://github.com/raphaelmansuy/opengenie"
Issues = "https://github.com/raphaelmansuy/opengenie/issues"
Changelog = "https://github.com/raphaelmansuy/opengenie/releases"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "pytest-xdist>=3.6",
       "ruff>=0.6", "mypy>=1.10"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# Parallel by default: 410 tests took 40s serially and 16s on four workers, and every one of them
# is independent (no shared database, no shared temp dir). `-p no:cacheprovider` keeps a parallel run
# from writing a cache another run is reading. A single-file run stays serial: `-n 0`.
addopts = "-n auto --dist loadfile"

[tool.ruff]
line-length = 108
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
